# The project's ID card. Tools like uv and pip read this file to learn what localbench is,
# what it needs, and how to package it so anyone can install it.

# Who and what localbench is: the facts shown when someone looks the package up or installs it.
# "dependencies" are the outside libraries localbench needs to run: pydantic gives every piece
# of data a fixed, checked shape; typer turns Python functions into terminal commands; rich
# prints tidy tables and colors in the terminal.
[project]
name = "localbench"
dynamic = ["version"]
description = "Benchmark local LLMs on your own hardware: speed, memory use and power."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Justin Hartman" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

# How the code in src/ gets bundled into an installable package. The version number is read
# from the package itself, so it only ever has to be changed in one place.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/localbench/__init__.py"

# Tools for people working on localbench, not for people using it: pytest runs the tests in
# tests/, and ruff keeps the code free of common mistakes and consistently formatted.
# The same checks run automatically on GitHub (see .github/workflows/ci.yml).
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
